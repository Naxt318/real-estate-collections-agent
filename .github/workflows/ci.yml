# Runs the same checks a developer runs before opening a pull request (CLAUDE.md §19),
# on a clean checkout with no .env files, so local configuration can't hide failures.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder for the frontend's validated env; nothing is called during the build.
      API_BASE_URL: http://localhost:3001
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version from package.json packageManager)
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Tenant-isolation and schema tests against real Postgres (CLAUDE.md §4.9, §18).
  # Uses the same docker compose file and role init script as local development.
  integration:
    name: Integration tests (Postgres, RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version from package.json packageManager)
        run: corepack enable

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Throwaway passwords for this run only; masked so they never appear in logs.
      - name: Write database .env for docker compose
        run: |
          owner_pw=$(openssl rand -hex 16)
          app_pw=$(openssl rand -hex 16)
          echo "::add-mask::$owner_pw"
          echo "::add-mask::$app_pw"
          {
            echo "POSTGRES_USER=app_owner"
            echo "POSTGRES_PASSWORD=$owner_pw"
            echo "POSTGRES_DB=collections_dev"
            echo "POSTGRES_PORT=5432"
            echo "APP_DB_PASSWORD=$app_pw"
          } > .env
          {
            echo "TEST_DATABASE_URL=postgresql://app_user:$app_pw@localhost:5432/collections_test"
            echo "TEST_MIGRATION_DATABASE_URL=postgresql://app_owner:$owner_pw@localhost:5432/collections_test"
          } >> "$GITHUB_ENV"

      - run: pnpm db:up
      - run: pnpm db:verify
      - run: pnpm test:integration

      - name: Stop database
        if: always()
        run: docker compose down -v
